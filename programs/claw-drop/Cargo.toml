[package]
name = "claw-drop"
version = "0.1.0"
description = "Claw Drop: a provably fair onchain claw machine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "claw_drop"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "vrf"] }
mpl-core = "=0.12.1"
